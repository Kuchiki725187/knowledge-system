server:
  port: 8080
  servlet:
    context-path: /api
  tomcat:
    # 线程上限减少，优化内存使用
    threads:
      max: 50

spring:
  config:
    # 本地开发有 secret 文件就加载;容器部署没有此文件(靠 SPRING_* 环境变量注入)也能启动
    import: optional:application-secret.yml
  application:
    name: knowledge-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/knowledge_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${secret.db.username}
    password: ${secret.db.password}
  data:
    redis:
      host: localhost
      port: 6379
      database: 0



  servlet:
    multipart:
      # 附件上传大小限制:单文件 10MB,整请求 10MB
      max-file-size: 10MB
      max-request-size: 10MB

# 附件存储目录(相对项目根)
app:
  upload:
    dir: uploads

# 阿里云 OSS
oss:
  endpoint: ${OSS_ENDPOINT:${secret.oss.endpoint:}}
  access-key-id: ${OSS_ACCESS_KEY_ID:${secret.oss.access-key-id:}}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET:${secret.oss.access-key-secret:}}
  bucket-name: ${OSS_BUCKET_NAME:${secret.oss.bucket-name:}}

  url-prefix: ${OSS_URL_PREFIX:${secret.oss.url-prefix:}}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  # 容器部署用环境变量 JWT_SECRET(来自 .env);本地开发回落 secret 文件
  secret: ${JWT_SECRET:${secret.jwt.secret}}
  access-ttl-hours: 2
  refresh-ttl-days: 7
