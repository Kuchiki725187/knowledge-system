server:
  port: 8080
  servlet:
    context-path: /api

spring:
  config:
    import: application-secret.yml
  application:
    name: knowledge-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/knowledge_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${secret.db.username}
    password: ${secret.db.password}
  data:
    redis:
      host: localhost
      port: 6379
      database: 0



  servlet:
    multipart:
      # 附件上传大小限制:单文件 10MB,整请求 10MB
      max-file-size: 10MB
      max-request-size: 10MB

# 附件存储目录(相对项目根)
app:
  upload:
    dir: uploads

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  # 容器部署用环境变量 JWT_SECRET(来自 .env);本地开发回落 secret 文件
  secret: ${JWT_SECRET:${secret.jwt.secret}}
  access-ttl-hours: 2
  refresh-ttl-days: 7
